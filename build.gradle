import org.gradle.internal.os.OperatingSystem

plugins {
    id "java"
    id 'java-library'
    id "application"
    id "org.openjfx.javafxplugin" version "0.0.13"
}

group 'com.scndgen'
version '22.05.04'

javafx {
    version = "21"
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.graphics']
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

project.ext.mainClass = 'com.scndgen.legends.ScndGenLegends'
project.ext.lwjglVersion = "3.3.6"

switch (OperatingSystem.current()) {
    case OperatingSystem.LINUX:
        def osArch = System.getProperty("os.arch")
        project.ext.lwjglNatives = osArch.startsWith("arm") || osArch.startsWith("aarch64")
                ? "natives-linux-${osArch.contains("64") || osArch.startsWith("armv8") ? "arm64" : "arm32"}"
                : "natives-linux"
        break
    case OperatingSystem.MAC_OS:
        project.ext.lwjglNatives = System.getProperty("os.arch").startsWith("aarch64") ? "natives-macos-arm64" : "natives-macos"
        break
    case OperatingSystem.WINDOWS:
        def osArch = System.getProperty("os.arch")
        project.ext.lwjglNatives = osArch.contains("64")
                ? "natives-windows${osArch.startsWith("aarch64") ? "-arm64" : ""}"
                : "natives-windows-x86"
        break
}

repositories {
    mavenCentral()
}

sourceSets {
    // Scene-by-scene NanoVG migration: enginev2 + game code needed for migrated scenes.
    nanovgPrototype {
        java {
            srcDirs = ['src/main/java']
            include 'io/github/subiyacryolite/enginev2/**'
            include 'com/scndgen/legends/enums/**'
            include 'com/scndgen/legends/constants/**'
            include 'com/scndgen/legends/Language.java'
            include 'com/scndgen/legends/state/**'
            include 'com/scndgen/legends/ui/**'
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    implementation "commons-codec:commons-codec:1.15"
    implementation "org.apache.commons:commons-lang3:3.12.0"
    implementation 'commons-io:commons-io:2.14.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.4.2'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.15.0-rc1'
    implementation "com.fasterxml.jackson.core:jackson-annotations:2.13.2"
    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-opengl"
    implementation "org.lwjgl:lwjgl-nanovg"
    implementation "org.lwjgl:lwjgl-nuklear"
    implementation "org.lwjgl:lwjgl-openal"
    implementation "org.lwjgl:lwjgl-stb"
    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-nanovg::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-nuklear::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-openal::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-stb::$lwjglNatives"

    nanovgPrototypeImplementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    nanovgPrototypeImplementation 'commons-io:commons-io:2.14.0'
    nanovgPrototypeImplementation 'com.fasterxml.jackson.core:jackson-databind:2.13.4.2'
    nanovgPrototypeImplementation 'com.fasterxml.jackson.core:jackson-core:2.15.0-rc1'
    nanovgPrototypeImplementation "com.fasterxml.jackson.core:jackson-annotations:2.13.2"
    nanovgPrototypeImplementation "org.lwjgl:lwjgl"
    nanovgPrototypeImplementation "org.lwjgl:lwjgl-glfw"
    nanovgPrototypeImplementation "org.lwjgl:lwjgl-opengl"
    nanovgPrototypeImplementation "org.lwjgl:lwjgl-nanovg"
    nanovgPrototypeImplementation "org.lwjgl:lwjgl-nuklear"
    nanovgPrototypeImplementation "org.lwjgl:lwjgl-stb"
    nanovgPrototypeImplementation "org.lwjgl:lwjgl-openal"
    nanovgPrototypeRuntimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    nanovgPrototypeRuntimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    nanovgPrototypeRuntimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"
    nanovgPrototypeRuntimeOnly "org.lwjgl:lwjgl-nanovg::$lwjglNatives"
    nanovgPrototypeRuntimeOnly "org.lwjgl:lwjgl-nuklear::$lwjglNatives"
    nanovgPrototypeRuntimeOnly "org.lwjgl:lwjgl-stb::$lwjglNatives"
    nanovgPrototypeRuntimeOnly "org.lwjgl:lwjgl-openal::$lwjglNatives"
}

application {
    mainClass = project.ext.mainClass
}

tasks.register('runNanoVgPrototype', JavaExec) {
    group = 'application'
    description = 'Runs the GLFW + OpenGL 3.3 + NanoVG rendering prototype / migrated scenes'
    dependsOn sourceSets.nanovgPrototype.classesTaskName
    classpath = sourceSets.nanovgPrototype.runtimeClasspath
    mainClass = 'io.github.subiyacryolite.enginev2.NanoVgPrototype'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
                "Implementation-Title": rootProject.name,
                "Implementation-Version": project.version,
                "Created-By": "${System.getProperty("java.version")} (${System.getProperty("java.specification.vendor")})",
                "Main-Class": project.ext.mainClass,
        )
    }
    from {
        configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }
    }
}
