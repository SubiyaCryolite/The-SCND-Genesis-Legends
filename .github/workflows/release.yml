# Build platform fat JARs and attach them to a GitHub Release when a tag is pushed.
# Example: git tag v22.05.05 && git push origin v22.05.05
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-latest
            label: linux-x64
          - os: macos-latest
            label: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build fat JAR
        shell: bash
        run: ./gradlew --no-daemon jar

      - name: Stage named JAR
        shell: bash
        run: |
          mkdir -p dist
          jar="$(ls build/libs/*.jar | head -n 1)"
          cp "$jar" "dist/legends-${GITHUB_REF_NAME}-${{ matrix.label }}.jar"

      - name: Upload build product
        uses: actions/upload-artifact@v4
        with:
          name: legends-${{ matrix.label }}
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all JARs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
