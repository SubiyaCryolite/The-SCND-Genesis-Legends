# Build a platform zip (thin JAR + libs/) and attach it to a GitHub Release.
# Example: git tag v22.05.05 && git push origin v22.05.05
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-latest
            label: linux-x64
          - os: macos-latest
            label: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Package zip
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon packageZip -PbuildId="${GITHUB_REF_NAME}"

      - name: Stage archive
        shell: bash
        run: |
          mkdir -p dist
          cp build/dist/*.zip dist/

      - name: Upload build product
        uses: actions/upload-artifact@v4
        with:
          name: legends-${{ matrix.label }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
