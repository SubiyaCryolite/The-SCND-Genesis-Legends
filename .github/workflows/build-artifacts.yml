# Build downloadable fat JARs on every push to main.
# Each OS runner picks the matching LWJGL natives via build.gradle.
name: Build artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            artifact: legends-windows-x64
          - os: ubuntu-latest
            label: linux-x64
            artifact: legends-linux-x64
          - os: macos-latest
            label: macos-arm64
            artifact: legends-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build fat JAR
        shell: bash
        run: ./gradlew --no-daemon jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
