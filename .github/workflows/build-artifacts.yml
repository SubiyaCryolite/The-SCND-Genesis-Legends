# Build a downloadable zip (thin JAR + libs/) on every push to main.
# Each OS runner picks the matching LWJGL natives via build.gradle.
name: Build artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            artifact: legends-windows-x64
          - os: ubuntu-latest
            label: linux-x64
            artifact: legends-linux-x64
          - os: macos-latest
            label: macos-arm64
            artifact: legends-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Package zip
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon packageZip -PbuildId="dev-${GITHUB_SHA::7}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: build/dist/*.zip
          if-no-files-found: error
          retention-days: 14
